[target.aarch64-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=0x10000",
    "-C", "link-arg=-Wl,-z,common-page-size=0x10000"
]

[target.armv7-linux-androideabi]
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=0x10000",
    "-C", "link-arg=-Wl,-z,common-page-size=0x10000"
]

[target.i686-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=0x10000",
    "-C", "link-arg=-Wl,-z,common-page-size=0x10000"
]

[target.x86_64-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=0x10000",
    "-C", "link-arg=-Wl,-z,common-page-size=0x10000"
]

[build]
# Uncomment when working on Android-specific code:
target = "aarch64-linux-android"